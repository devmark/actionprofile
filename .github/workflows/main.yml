name: Build WF
on:
  push:
    branches:
      - main

  pull_request:
    branches: 
      - main
  workflow_dispatch:
  
  schedule:
    - cron: "0 2 * * *"   # nightly run at 2 AM UTC

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        
      - name: Maven Build
        run: mvn install

      - name: Upload Artifact(WAR)
        uses: actions/upload-artifact@v5
        with:
          name: vprofile-app
          path: target/*.war

      - name: Notify if Build Fails
        if: failure()
        run: |
          echo "Build failed. Sending notification email..."
        
  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
        
      - name: Maven test
        if: github.ref == 'refs/heads/main'
        run: mvn test

      - name: Checkstyle
        if: github.ref == 'refs/heads/main'
        run: mvn checkstyle:checkstyle
      
      - name: Rujn test on other branches
        if: github.ref != 'refs/heads/main'
        run: echo "code analysis and test will not run on this branch"

  Security-Scan:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: .
          exit-code: 0
          vuln-type: 'os,library'
          format: 'json'
          output: 'trivy-report.json'

      - name: upload Security Scan artifact
        uses: actions/upload-artifact@v5
        with:
          name: trivy-scan-results
          path: trivy-report.json
      